<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Smart Cash</title>
<meta name="description" content="Fast, offline personal cash management across multiple accounts and currencies.">
<meta name="theme-color" content="#121A33">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Smart Cash">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --ink:#121A33; --ink-soft:#28345A; --ink-2:#1E2A4E;
  --paper:#F7F5F0; --paper-2:#FFFFFF; --paper-3:#EEEAE1;
  --brass:#C08A2E; --brass-soft:#E7C685; --brass-bright:#D8A548;
  --sage:#3F7D5C; --sage-bg:#E4EFE8;
  --clay:#B33F3F; --clay-bg:#F5E4E1;
  --slate:#6B7280; --slate-soft:#9CA3AF;
  --line:#E4E0D6;
  --text:#1B2333; --text-dim:#5B6478;
  --shadow: 0 1px 2px rgba(20,33,61,.05), 0 8px 24px rgba(20,33,61,.07);
  --shadow-lg: 0 4px 10px rgba(18,26,51,.08), 0 20px 44px rgba(18,26,51,.10);
  --shadow-hero: 0 14px 30px -8px rgba(18,26,51,.45), 0 4px 12px rgba(18,26,51,.25);
  --nav-bg: rgba(255,255,255,.82);
  --radius-lg:24px; --radius-md:16px; --radius-sm:11px;
  --font-ui:'Manrope',system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;
  --font-num:'Space Mono','Manrope',monospace;
  --safe-t: env(safe-area-inset-top,0px);
  --safe-b: env(safe-area-inset-bottom,0px);
  --ease: cubic-bezier(.22,.9,.32,1);
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --ink:#EDEEF2; --ink-soft:#C7CCDA; --ink-2:#D8DCE6;
    --paper:#0B1120; --paper-2:#141B2E; --paper-3:#1B2438;
    --brass:#D9A548; --brass-soft:#3A2E17; --brass-bright:#E6BA6B;
    --sage:#6FBF95; --sage-bg:#132A20;
    --clay:#E17575; --clay-bg:#301A1A;
    --slate:#8B93A7; --slate-soft:#5B6478;
    --line:#252F49;
    --text:#EDEEF2; --text-dim:#8D96AC;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.4);
    --shadow-lg: 0 4px 14px rgba(0,0,0,.4), 0 24px 48px rgba(0,0,0,.5);
    --shadow-hero: 0 18px 36px -10px rgba(0,0,0,.6), 0 4px 14px rgba(0,0,0,.4);
    --nav-bg: rgba(20,27,46,.86);
  }
}
:root[data-theme="dark"]{
  --ink:#EDEEF2; --ink-soft:#C7CCDA; --ink-2:#D8DCE6;
  --paper:#0B1120; --paper-2:#141B2E; --paper-3:#1B2438;
  --brass:#D9A548; --brass-soft:#3A2E17; --brass-bright:#E6BA6B;
  --sage:#6FBF95; --sage-bg:#132A20;
  --clay:#E17575; --clay-bg:#301A1A;
  --slate:#8B93A7; --slate-soft:#5B6478;
  --line:#252F49;
  --text:#EDEEF2; --text-dim:#8D96AC;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.4);
  --shadow-lg: 0 4px 14px rgba(0,0,0,.4), 0 24px 48px rgba(0,0,0,.5);
  --shadow-hero: 0 18px 36px -10px rgba(0,0,0,.6), 0 4px 14px rgba(0,0,0,.4);
  --nav-bg: rgba(20,27,46,.86);
}
*{box-sizing:border-box;}
html{scroll-padding-top:var(--safe-t);}
html,body{height:100%;}
body{
  margin:0; background:var(--paper); color:var(--text);
  font-family:var(--font-ui); font-size:15px; -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
  background-image: radial-gradient(600px 300px at 15% -8%, rgba(192,138,46,.06), transparent 60%);
  background-attachment: fixed;
}
button,input,select,textarea{font-family:inherit; color:inherit;}
button{cursor:pointer;}
h1,h2,h3,p{margin:0;}
::selection{background:var(--brass-soft);}
a{color:inherit;}
.hidden{display:none!important;}

/* focus visibility */
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--brass); outline-offset:2px;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms!important; transition-duration:.001ms!important;}
}

/* ============ APP SHELL ============ */
#appRoot{max-width:560px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; position:relative; background:var(--paper);}
[dir="rtl"] #appRoot{direction:rtl;}

.topbar{
  position:sticky; top:0; z-index:20; background:var(--nav-bg);
  -webkit-backdrop-filter:saturate(180%) blur(16px); backdrop-filter:saturate(180%) blur(16px);
  padding:calc(14px + var(--safe-t)) 18px 12px;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  border-bottom:1px solid transparent;
  transition:border-color .2s;
}
.topbar.scrolled{border-bottom-color:var(--line);}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{
  width:34px; height:34px; border-radius:10.5px;
  background:linear-gradient(155deg, var(--ink) 0%, var(--ink-2, var(--ink-soft)) 130%);
  color:var(--brass-bright);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-num); font-weight:700; font-size:14px;
  flex-shrink:0; box-shadow:0 3px 8px rgba(18,26,51,.35), inset 0 1px 0 rgba(255,255,255,.08);
  letter-spacing:-.03em;
}
.brand-title{font-weight:800; font-size:17px; letter-spacing:-.015em;}
.topbar-actions{display:flex; align-items:center; gap:6px;}
.icon-btn{
  width:38px; height:38px; border-radius:12px; border:none; background:var(--paper-3);
  display:flex; align-items:center; justify-content:center; font-size:17px; color:var(--text);
  transition:background .15s, transform .12s var(--ease);
}
.icon-btn:active{transform:scale(.9);}

main#app{flex:1; padding:4px 18px calc(110px + var(--safe-b)); overflow-x:hidden;}
main#app.page-anim{animation:pageIn .32s var(--ease);}
@keyframes pageIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

#splashScreen{
  position:fixed; inset:0; z-index:1000; background:linear-gradient(160deg, var(--ink-2,#1E2A4E) 0%, var(--ink) 70%);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  transition:opacity .4s var(--ease), visibility .4s;
}
#splashScreen.hide{opacity:0; visibility:hidden; pointer-events:none;}
.splash-mark{
  width:72px; height:72px; border-radius:20px; background:rgba(255,255,255,.06);
  color:var(--brass-bright); display:flex; align-items:center; justify-content:center;
  font-family:var(--font-num); font-weight:700; font-size:26px; box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
  animation:splashPulse 1.4s ease-in-out infinite;
}
@keyframes splashPulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.06);} }
.splash-title{color:#F7F5F0; font-weight:800; font-size:16px; letter-spacing:.01em;}

.success-flash{
  position:fixed; inset:0; z-index:400; display:flex; align-items:center; justify-content:center;
  pointer-events:none; opacity:0;
}
.success-flash.show{animation:flashPop .6s var(--ease);}
.success-flash .sf-circle{
  width:84px; height:84px; border-radius:50%; background:var(--sage); color:#fff; font-size:36px;
  display:flex; align-items:center; justify-content:center; box-shadow:0 10px 30px rgba(63,125,92,.4);
}
@keyframes flashPop{
  0%{opacity:0; transform:scale(.6);}
  35%{opacity:1; transform:scale(1.08);}
  55%{opacity:1; transform:scale(1);}
  100%{opacity:0; transform:scale(1);}
}

.bottomnav{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  max-width:560px; margin:0 auto;
  background:var(--nav-bg); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);
  padding:8px 10px calc(10px + var(--safe-b));
  display:grid; grid-template-columns:1fr 1fr 64px 1fr 1fr; align-items:center; gap:2px;
}
.nav-item{
  background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:6px 2px; border-radius:12px; color:var(--text-dim); font-size:10.5px; font-weight:600;
  transition:color .15s, transform .12s var(--ease);
}
.nav-item .nav-ic{font-size:19px; line-height:1; transition:transform .18s var(--ease);}
.nav-item.active{color:var(--brass);}
.nav-item.active .nav-ic{transform:translateY(-1px) scale(1.08);}
.nav-fab{
  width:58px; height:58px; border-radius:50%;
  background:linear-gradient(160deg, var(--ink-2, var(--ink-soft)) 0%, var(--ink) 75%);
  color:var(--brass-bright);
  border:none; font-size:27px; font-weight:300; display:flex; align-items:center; justify-content:center;
  box-shadow:0 8px 20px rgba(18,26,51,.4), inset 0 1px 0 rgba(255,255,255,.12);
  margin:0 auto; transform:translateY(-16px);
  transition:transform .18s var(--ease), box-shadow .18s var(--ease);
}
.nav-fab:active{transform:translateY(-16px) scale(.9); box-shadow:0 4px 12px rgba(18,26,51,.4);}

/* ============ TYPOGRAPHY HELPERS ============ */
.page-title{font-size:23px; font-weight:800; letter-spacing:-.01em; margin:10px 0 4px;}
.page-sub{color:var(--text-dim); font-size:13.5px; margin-bottom:18px;}
.section-head{display:flex; align-items:center; justify-content:space-between; margin:22px 0 10px;}
.section-head h3{font-size:14.5px; font-weight:700;}
.link-btn{background:none; border:none; color:var(--brass); font-weight:700; font-size:13px; padding:4px;}
.amount{font-family:var(--font-num); font-variant-numeric:tabular-nums; letter-spacing:-.02em;}
.pos{color:var(--sage);}
.neg{color:var(--clay);}

/* ============ CARDS ============ */
.card{background:var(--paper-2); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); padding:18px; border:1px solid rgba(120,120,120,.06);}
.hero-balance{
  background:linear-gradient(155deg, var(--ink-2, var(--ink-soft)) 0%, var(--ink) 68%);
  color:var(--paper);
  border-radius:var(--radius-lg); padding:24px 22px 20px; margin-top:8px;
  position:relative; overflow:hidden; box-shadow:var(--shadow-hero);
  animation: heroIn .6s var(--ease);
}
@keyframes heroIn{ from{opacity:0; transform:translateY(6px) scale(.985);} to{opacity:1; transform:translateY(0) scale(1);} }
.hero-balance::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(160px 120px at 90% -15%, rgba(216,165,72,.32), transparent 70%),
             radial-gradient(220px 140px at -10% 115%, rgba(216,165,72,.10), transparent 70%);
}
.hero-balance::before{
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
  background-image:
    repeating-linear-gradient(115deg, rgba(255,255,255,.025) 0px, rgba(255,255,255,.025) 1px, transparent 1px, transparent 3px);
}
.hero-label{font-size:12.5px; color:var(--brass-soft); font-weight:700; opacity:.95; position:relative; letter-spacing:.01em;}
.hero-figure{font-family:var(--font-num); font-size:35px; font-weight:700; margin-top:7px; letter-spacing:-.02em; position:relative;}
.currency-tabs{display:flex; gap:6px; margin-top:16px; position:relative;}
.ctab{
  flex:1; text-align:center; padding:8px 4px; border-radius:10px; background:rgba(255,255,255,.07);
  border:none; color:rgba(247,245,240,.6); font-weight:700; font-size:12.5px; font-family:var(--font-num);
  transition:background .18s var(--ease), color .18s var(--ease);
}
.ctab.active{background:var(--brass-bright); color:var(--ink); box-shadow:0 3px 10px rgba(0,0,0,.25);}

.cbox-scroll{display:flex; gap:10px; overflow-x:auto; padding:4px 2px 10px; margin:0 -2px; scrollbar-width:none;}
.cbox-scroll::-webkit-scrollbar{display:none;}
.cbox-card{
  min-width:152px; background:var(--paper-2); border-radius:var(--radius-md); box-shadow:var(--shadow);
  padding:15px; flex-shrink:0; border:1px solid var(--line);
  transition:transform .15s var(--ease), box-shadow .15s var(--ease);
}
.cbox-card:active{transform:scale(.97);}
.cbox-card .cb-icon{width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:16px; margin-bottom:10px;}
.cbox-card .cb-name{font-weight:700; font-size:13.5px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.cbox-card .cb-bal{font-family:var(--font-num); font-weight:700; font-size:16px;}
.cbox-card.add-new{display:flex; align-items:center; justify-content:center; flex-direction:column; gap:6px; color:var(--text-dim); border-style:dashed; box-shadow:none;}

.txn-row{
  display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line);
}
.txn-row:last-child{border-bottom:none;}
.txn-ic{width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;}
.txn-mid{flex:1; min-width:0;}
.txn-desc{font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.txn-meta{font-size:12px; color:var(--text-dim); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.txn-right{text-align:end; flex-shrink:0;}
.txn-amt{font-weight:700; font-size:14.5px;}
.txn-date{font-size:11px; color:var(--text-dim); margin-top:2px;}
.txn-row{position:relative;}
.txn-row .swipe-actions{display:flex; gap:6px;}
.mini-btn{border:none; background:var(--paper-3); width:30px; height:30px; border-radius:9px; font-size:13px; display:flex; align-items:center; justify-content:center;}

/* budget bar */
.budget-item{margin-bottom:14px;}
.budget-top{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:6px;}
.budget-top .bname{font-weight:700;}
.budget-track{height:8px; border-radius:6px; background:var(--paper-3); overflow:hidden;}
.budget-fill{height:100%; border-radius:6px; background:var(--sage); transition:width .3s;}
.budget-fill.warn{background:var(--brass);}
.budget-fill.over{background:var(--clay);}

/* ============ FORM ELEMENTS ============ */
.field{margin-bottom:16px;}
.field label{display:block; font-size:12.5px; font-weight:700; color:var(--text-dim); margin-bottom:6px;}
.field input[type=text], .field input[type=number], .field input[type=date], .field input[type=password], .field select, .field textarea{
  width:100%; border:1.5px solid var(--line); background:var(--paper-2); border-radius:var(--radius-sm);
  padding:12px 13px; font-size:15px; color:var(--text);
}
.field textarea{resize:vertical; min-height:60px;}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--brass); outline:none;}
.seg{display:flex; background:var(--paper-3); border-radius:var(--radius-sm); padding:3px;}
.seg button{flex:1; border:none; background:none; padding:10px 8px; border-radius:8px; font-weight:700; font-size:13.5px; color:var(--text-dim);}
.seg button.active{background:var(--paper-2); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.12);}
.chip-row{display:flex; flex-wrap:wrap; gap:8px;}
.chip{
  border:1.5px solid var(--line); background:var(--paper-2); border-radius:20px; padding:8px 13px;
  font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px; color:var(--text);
}
.chip.active{border-color:var(--brass); background:var(--brass-soft); color:var(--ink);}
:root[data-theme="dark"] .chip.active{color:var(--ink);}
.swatch-row{display:flex; flex-wrap:wrap; gap:9px;}
.swatch{width:32px; height:32px; border-radius:9px; border:2px solid transparent; display:flex; align-items:center; justify-content:center; font-size:15px;}
.swatch.active{border-color:var(--ink);}
.emoji-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; max-height:180px; overflow-y:auto;}
.emoji-cell{border:1.5px solid transparent; background:var(--paper-3); border-radius:9px; height:36px; display:flex; align-items:center; justify-content:center; font-size:17px;}
.emoji-cell.active{border-color:var(--brass);}

.btn{
  display:flex; align-items:center; justify-content:center; gap:8px; width:100%; border:none;
  padding:14px; border-radius:var(--radius-sm); font-weight:700; font-size:15px;
  transition:transform .12s var(--ease), opacity .15s, box-shadow .15s var(--ease);
  position:relative; overflow:hidden;
}
.btn:active{transform:scale(.97);}
.btn-primary{
  background:linear-gradient(160deg, var(--ink-2, var(--ink-soft)) 0%, var(--ink) 80%); color:var(--brass-bright);
  box-shadow:0 6px 16px rgba(18,26,51,.28), inset 0 1px 0 rgba(255,255,255,.1);
}
.btn-danger{background:var(--clay-bg); color:var(--clay);}
.btn-ghost{background:var(--paper-3); color:var(--text);}
.btn-sm{width:auto; padding:9px 16px; font-size:13px;}
.btn[disabled]{opacity:.45; pointer-events:none;}

.search-bar{
  display:flex; align-items:center; gap:9px; background:var(--paper-2); border:1.5px solid var(--line);
  border-radius:var(--radius-sm); padding:10px 13px; margin-bottom:12px;
}
.search-bar input{border:none; background:none; flex:1; font-size:14.5px; outline:none;}
.filter-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; margin-bottom:6px; scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.filter-pill{white-space:nowrap; border:1.5px solid var(--line); background:var(--paper-2); border-radius:20px; padding:7px 13px; font-size:12.5px; font-weight:700; color:var(--text-dim); flex-shrink:0;}
.filter-pill.active{background:var(--ink); color:var(--brass); border-color:var(--ink);}

/* ============ MODAL / SHEET ============ */
.overlay{
  position:fixed; inset:0; background:rgba(15,22,38,.5); z-index:100; display:flex; align-items:flex-end;
  opacity:0; pointer-events:none; transition:opacity .2s;
}
.overlay.show{opacity:1; pointer-events:auto;}
.sheet{
  background:var(--paper); width:100%; max-width:560px; margin:0 auto; border-radius:24px 24px 0 0;
  max-height:92vh; overflow-y:auto; padding:14px 20px calc(24px + var(--safe-b));
  transform:translateY(100%); transition:transform .25s cubic-bezier(.32,.72,0,1);
}
.overlay.show .sheet{transform:translateY(0);}
.sheet-handle{width:38px; height:4px; background:var(--line); border-radius:3px; margin:0 auto 14px;}
.sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.sheet-head h2{font-size:18px; font-weight:800;}
.sheet-close{background:var(--paper-3); border:none; width:32px; height:32px; border-radius:10px; font-size:15px;}

.confirm-box{text-align:center; padding:6px 6px 2px;}
.confirm-ic{width:52px; height:52px; border-radius:50%; background:var(--clay-bg); color:var(--clay); font-size:24px; display:flex; align-items:center; justify-content:center; margin:0 auto 14px;}
.confirm-box h3{font-size:16.5px; font-weight:800; margin-bottom:6px;}
.confirm-box p{color:var(--text-dim); font-size:13.5px; line-height:1.5; margin-bottom:20px;}
.confirm-actions{display:flex; gap:10px;}

/* toast */
#toastHost{position:fixed; left:0; right:0; bottom:calc(96px + var(--safe-b)); z-index:200; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none;}
.toast{
  background:var(--ink); color:var(--paper); padding:11px 16px; border-radius:14px; font-size:13.5px; font-weight:600;
  display:flex; align-items:center; gap:14px; box-shadow:0 6px 20px rgba(0,0,0,.3); pointer-events:auto;
  animation:toastIn .2s ease-out;
}
@keyframes toastIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
.toast button{background:none; border:none; color:var(--brass); font-weight:800; font-size:13px;}

/* empty state */
.empty{text-align:center; padding:50px 20px 30px; color:var(--text-dim);}
.empty .e-ic{font-size:40px; margin-bottom:14px;}
.empty h3{color:var(--text); font-size:16px; font-weight:800; margin-bottom:6px;}
.empty p{font-size:13.5px; line-height:1.5; margin-bottom:18px;}

/* lock screen */
.lockscreen{position:fixed; inset:0; background:var(--ink); z-index:500; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--paper); padding:20px;}
.lock-mark{width:64px; height:64px; border-radius:18px; background:rgba(192,138,46,.15); color:var(--brass); display:flex; align-items:center; justify-content:center; font-size:28px; margin-bottom:18px;}
.pin-dots{display:flex; gap:14px; margin:22px 0;}
.pin-dot{width:14px; height:14px; border-radius:50%; border:2px solid var(--brass-soft);}
.pin-dot.filled{background:var(--brass); border-color:var(--brass);}
.pin-pad{display:grid; grid-template-columns:repeat(3,64px); gap:14px;}
.pin-key{width:64px; height:64px; border-radius:50%; background:rgba(255,255,255,.06); border:none; color:var(--paper); font-size:20px; font-weight:700;}
.pin-key:active{background:rgba(255,255,255,.15);}
.lock-error{color:var(--clay); font-size:13px; margin-top:10px; height:16px;}

/* onboarding */
.onb{text-align:center; padding:40px 10px;}
.onb .onb-mark{width:76px; height:76px; border-radius:22px; background:var(--ink); color:var(--brass); font-size:34px; display:flex; align-items:center; justify-content:center; margin:0 auto 22px; font-family:var(--font-num); font-weight:700;}
.onb h1{font-size:24px; font-weight:800; margin-bottom:8px;}
.onb p{color:var(--text-dim); font-size:14px; line-height:1.6; margin-bottom:26px; max-width:340px; margin-inline:auto;}

/* report bars */
.bar-row{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.bar-label{width:76px; font-size:12px; font-weight:700; color:var(--text-dim); flex-shrink:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.bar-track{flex:1; height:20px; border-radius:6px; background:var(--paper-3); overflow:hidden;}
.bar-fill{height:100%; border-radius:6px;}
.bar-val{font-family:var(--font-num); font-size:12px; font-weight:700; width:70px; text-align:end; flex-shrink:0;}

.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0;}
.stat-box{background:var(--paper-2); border-radius:var(--radius-md); padding:14px; box-shadow:var(--shadow);}
.stat-box .s-label{font-size:11.5px; color:var(--text-dim); font-weight:700; margin-bottom:6px;}
.stat-box .s-val{font-family:var(--font-num); font-size:18px; font-weight:700;}

.settings-row{display:flex; align-items:center; justify-content:space-between; padding:14px 2px; border-bottom:1px solid var(--line);}
.settings-row:last-child{border-bottom:none;}
.settings-row .sr-label{font-weight:700; font-size:14px;}
.settings-row .sr-sub{font-size:12px; color:var(--text-dim); margin-top:1px;}
.settings-group{background:var(--paper-2); border-radius:var(--radius-md); padding:4px 14px; box-shadow:var(--shadow); margin-bottom:18px;}
.switch{width:44px; height:26px; border-radius:14px; background:var(--paper-3); position:relative; border:none; flex-shrink:0;}
.switch.on{background:var(--sage);}
.switch::after{content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:transform .18s; box-shadow:0 1px 3px rgba(0,0,0,.3);}
.switch.on::after{transform:translateX(18px);}
[dir="rtl"] .switch::after{left:auto; right:3px;}
[dir="rtl"] .switch.on::after{transform:translateX(-18px);}

.danger-zone{border:1.5px dashed var(--clay); border-radius:var(--radius-md); padding:14px; margin-bottom:18px;}
.danger-zone h4{color:var(--clay); font-size:13.5px; font-weight:800; margin-bottom:10px;}

@media (min-width:601px){
  body{background:var(--paper-3);}
  #appRoot{box-shadow:0 0 40px rgba(0,0,0,.08); min-height:100vh;}
}

const STORAGE_KEY = 'smartcash_data_v1';
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const todayISO = () => new Date().toISOString().slice(0,10);
const CURRENCIES = ['EUR','USD','EGP'];
const CURRENCY_SYMBOL = {EUR:'€', USD:'$', EGP:'E£'};

/* ---------------- default data ---------------- */
function defaultCategories(){
  return [
    {id:uid(), name_key:'cat_salary', icon:'💼', color:'#3F7D5C', type:'income'},
    {id:uid(), name_key:'cat_gift', icon:'🎁', color:'#C08A2E', type:'income'},

    {id:uid(), name_key:'cat_other_expense', icon:'➖', color:'#6B7280', type:'expense'},
  ];
}
function defaultState(){
  return {
    version:1,
    cashboxes:[],
    transactions:[],
    categories: defaultCategories(),
    recurring:[],
    budgets:[],
    settings:{
      language: (navigator.language||'en').slice(0,2)==='ar' ? 'ar' : ((navigator.language||'en').slice(0,2)==='it' ? 'it' : 'en'),
      theme:'auto',
      pinEnabled:false,
      pinCode:null,
      lastCashboxId:null,
      dashboardCurrency:'EUR',
      onboarded:false
    }
  };
}
let state = null;
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ state = JSON.parse(raw); }
    else { state = defaultState(); }
    if(!state.budgets) state.budgets=[];
    if(!state.settings.dashboardCurrency) state.settings.dashboardCurrency='EUR';
  }catch(e){ state = defaultState(); }
}
function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ console.error('Save failed', e); }
}

function t(key, vars){
  let s = (I18N[state.settings.language] && I18N[state.settings.language][key]) || I18N.en[key] || key;
  if(vars){ Object.keys(vars).forEach(k=>{ s = s.replace('{'+k+'}', vars[k]); }); }
  return s;
}
function catName(cat){
  if(!cat) return '';
  if(cat.name_key) return t(cat.name_key);
  return cat.name || '';
}

/* ---------------- formatting ---------------- */
function fmtNum(n){
  const sign = n<0 ? '-' : '';
  const v = Math.abs(n);
  return sign + v.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtAmount(n, currency){
  return CURRENCY_SYMBOL[currency] + ' ' + fmtNum(n);
}
function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  const locale = state.settings.language==='ar' ? 'ar-EG' : (state.settings.language==='it' ? 'it-IT' : 'en-GB');
  try{ return d.toLocaleDateString(locale, {day:'numeric', month:'short', year:'numeric'}); }
  catch(e){ return iso; }
}
function fmtDateShort(iso){
  const d = new Date(iso+'T00:00:00');
  const locale = state.settings.language==='ar' ? 'ar-EG' : (state.settings.language==='it' ? 'it-IT' : 'en-GB');
  try{ return d.toLocaleDateString(locale, {day:'numeric', month:'short'}); }
  catch(e){ return iso; }
}

/* ---------------- data logic ---------------- */
function getCashbox(id){ return state.cashboxes.find(c=>c.id===id); }
function getCategory(id){ return state.categories.find(c=>c.id===id); }

function cashboxBalance(cashboxId){
  const cb = getCashbox(cashboxId);
  if(!cb) return 0;
  let bal = cb.initialBalance || 0;
  state.transactions.forEach(tx=>{
    if(tx.deleted) return;
    if(tx.type==='income' && tx.cashboxId===cashboxId) bal += tx.amount;
    else if(tx.type==='expense' && tx.cashboxId===cashboxId) bal -= tx.amount;
    else if(tx.type==='transfer'){
      if(tx.cashboxId===cashboxId) bal -= tx.amount;
      if(tx.toCashboxId===cashboxId) bal += (tx.toAmount!=null ? tx.toAmount : tx.amount);
    }
  });
  return bal;
}
function totalsByCurrency(){
  const totals = {EUR:0, USD:0, EGP:0};
  state.cashboxes.forEach(cb=>{ totals[cb.currency] = (totals[cb.currency]||0) + cashboxBalance(cb.id); });
  return totals;
}
function activeTransactions(){ return state.transactions.filter(tx=>!tx.deleted); }

/* recurring processing: generate due transactions up to today */
function nextDateFrom(dateISO, freq){
  const d = new Date(dateISO+'T00:00:00');
  if(freq==='daily') d.setDate(d.getDate()+1);
  else if(freq==='weekly') d.setDate(d.getDate()+7);
  else d.setMonth(d.getMonth()+1);
  return d.toISOString().slice(0,10);
}
function processRecurring(){
  const today = todayISO();
  let changed = false;
  state.recurring.forEach(rule=>{
    if(!rule.active) return;
    let guard = 0;
    while(rule.nextDate <= today && guard < 600 && (!rule.endDate || rule.nextDate <= rule.endDate)){
      state.transactions.push({
        id: uid(), cashboxId: rule.cashboxId, type: rule.type, amount: rule.amount,
        categoryId: rule.categoryId, description: rule.description, date: rule.nextDate,
        recurringId: rule.id, createdAt: Date.now()
      });
      rule.nextDate = nextDateFrom(rule.nextDate, rule.frequency);
      changed = true; guard++;
      if(rule.endDate && rule.nextDate > rule.endDate){ rule.active = false; break; }
    }
  });
  if(changed) save();
}

/* ---------------- toast ---------------- */
function showToast(msg, actionLabel, actionFn){
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className='toast';
  el.innerHTML = `<span>${msg}</span>` + (actionLabel? `<button type="button">${actionLabel}</button>`:'');
  if(actionLabel && actionFn){
    el.querySelector('button').addEventListener('click', ()=>{ actionFn(); el.remove(); });
  }
  host.appendChild(el);
  setTimeout(()=>{ if(el.parentNode) el.remove(); }, 4500);
}
function flashSuccess(){
  const el = document.getElementById('successFlash');
  if(!el) return;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 650);
}

/* ---------------- soft delete + undo ---------------- */
function softDeleteTxn(id){
  const tx = state.transactions.find(x=>x.id===id);
  if(!tx) return;
  tx.deleted = true; save(); renderApp();
  showToast(t('deleted'), t('undo'), ()=>{ tx.deleted=false; save(); renderApp(); });
}

function applyThemeAndDir(){
  document.documentElement.lang = state.settings.language;
  document.documentElement.dir = state.settings.language==='ar' ? 'rtl' : 'ltr';
  document.documentElement.setAttribute('data-theme', state.settings.theme==='auto' ? '' : state.settings.theme);
  document.getElementById('pageHeadTitle').textContent = t('app_name');
  document.querySelectorAll('#bottomnav [data-t]').forEach(el=>{ el.textContent = t(el.getAttribute('data-t')); });
  document.querySelectorAll('#bottomnav .nav-item').forEach(el=>{
    el.classList.toggle('active', el.getAttribute('data-route')===route || (route==='cashbox' && el.getAttribute('data-route')==='cashboxes'));
  });
}

function renderApp(){
  if(!state.settings.onboarded && state.cashboxes.length===0){
    document.getElementById('bottomnav').style.display='none';
    document.getElementById('topbar').style.display='none';
    document.getElementById('app').innerHTML = renderOnboarding();
  } else {
    document.getElementById('bottomnav').style.display='';
    document.getElementById('topbar').style.display='';
    let html='';
    if(route==='dashboard') html = renderDashboard();
    else if(route==='cashboxes') html = renderCashboxes();
    else if(route==='cashbox') html = renderCashboxDetail(routeParam);
    else if(route==='ledger') html = renderLedger();
    else if(route==='reports') html = renderReports();
    else if(route==='settings') html = renderSettings();
    else if(route==='categories') html = renderCategories();
    else if(route==='recurring') html = renderRecurring();
    else html = renderDashboard();
    document.getElementById('app').innerHTML = html;
  }
  applyThemeAndDir();
  bindDynamicEvents();
  const appEl = document.getElementById('app');
  appEl.classList.remove('page-anim');
  void appEl.offsetWidth;
  appEl.classList.add('page-anim');
}

function renderBudgetItem(b){
  const cat = getCategory(b.categoryId);
  const spent = monthSpendForCategory(b.categoryId);
  const pct = Math.min(100, Math.round((spent/b.limit)*100)) || 0;
  const cls = pct>=100 ? 'over' : (pct>=80 ? 'warn' : '');
  return `<div class="budget-item">
    <div class="budget-top"><span class="bname">${cat?cat.icon+' '+catName(cat):'—'}</span><span class="amount">${t('spent_of',{spent:fmtNum(spent), limit:fmtNum(b.limit)})} ${CURRENCY_SYMBOL[b.currency]}</span></div>
    <div class="budget-track"><div class="budget-fill ${cls}" style="width:${pct}%"></div></div>
  </div>`;
}
function monthSpendForCategory(categoryId){
  const ym = todayISO().slice(0,7);
  return activeTransactions().filter(tx=>tx.type==='expense' && tx.categoryId===categoryId && tx.date.slice(0,7)===ym)
    .reduce((s,tx)=>s+tx.amount,0);
}

function renderTxnRow(tx){
  const cat = getCategory(tx.categoryId);
  const cb = getCashbox(tx.cashboxId);
  const toCb = tx.toCashboxId ? getCashbox(tx.toCashboxId) : null;
  let icon = '💱', color='#6B7280', label='', sign='', amtCls='';
  if(tx.type==='income'){ icon = cat?cat.icon:'➕'; color = cat?cat.color:'#3F7D5C'; sign='+'; amtCls='pos'; }
  else if(tx.type==='expense'){ icon = cat?cat.icon:'➖'; color = cat?cat.color:'#B33F3F'; sign='-'; amtCls='neg'; }
  else { icon='🔁'; color='#C08A2E'; sign=''; amtCls=''; }
  const desc = tx.description ? escapeHtml(tx.description) : (tx.type==='transfer' ? t('transfer') : (cat?catName(cat):t(tx.type)));
  const metaParts = [];
  if(tx.type==='transfer'){ metaParts.push((cb?cb.name:'')+' → '+(toCb?toCb.name:'')); }
  else { if(cat) metaParts.push(catName(cat)); if(cb) metaParts.push(cb.name); }
  const amount = tx.type==='transfer' ? fmtAmount(tx.amount, cb?cb.currency:'EUR') : fmtAmount(tx.amount, cb?cb.currency:'EUR');
  return `<div class="txn-row" data-txn="${tx.id}">
    <div class="txn-ic" style="background:${color}20; color:${color}">${icon}</div>
    <div class="txn-mid"><div class="txn-desc">${desc}</div><div class="txn-meta">${escapeHtml(metaParts.join(' · '))}</div></div>
    <div class="txn-right"><div class="txn-amt ${amtCls} amount">${sign}${amount}</div><div class="txn-date">${fmtDateShort(tx.date)}</div></div>
  </div>`;
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }

/* ============================================================

   ============================================================ */
function rangeForPreset(preset){
  const today = todayISO();
  if(preset==='today') return {from:today, to:today};
  if(preset==='month') return {from: today.slice(0,8)+'01', to: today};
  return {from: ui.reportsFrom, to: ui.reportsTo};
}
function renderReports(){
  const range = rangeForPreset(ui.reportsRange);
  const list = activeTransactions().filter(tx=> tx.type!=='transfer' && tx.date>=range.from && tx.date<=range.to);

  // totals by currency
  const totals = {}; // currency -> {income, expense}
  list.forEach(tx=>{
    const cb = getCashbox(tx.cashboxId); if(!cb) return;
    totals[cb.currency] = totals[cb.currency] || {income:0, expense:0};
    if(tx.type==='income') totals[cb.currency].income += tx.amount; else totals[cb.currency].expense += tx.amount;
  });
  const totalsHtml = Object.keys(totals).length ? Object.keys(totals).map(cur=>{
    const d = totals[cur];
    return `<div class="stat-box">
      <div class="s-label">${cur}</div>
      <div class="s-val pos">+${fmtNum(d.income)}</div>
      <div class="s-val neg">-${fmtNum(d.expense)}</div>
      <div class="s-val" style="margin-top:4px; border-top:1px solid var(--line); padding-top:6px;">${t('net')}: ${fmtNum(d.income-d.expense)}</div>
    </div>`;
  }).join('') : `<div class="empty" style="padding:30px 10px;"><div class="e-ic">📊</div><h3>${t('no_transactions')}</h3></div>`;

  // by category (expenses)
  const byCat = {};
  list.filter(tx=>tx.type==='expense').forEach(tx=>{ byCat[tx.categoryId] = (byCat[tx.categoryId]||0)+tx.amount; });
  const maxCat = Math.max(1, ...Object.values(byCat));
  const catBars = Object.keys(byCat).sort((a,b)=>byCat[b]-byCat[a]).map(cid=>{
    const cat = getCategory(cid);
    const pct = Math.round((byCat[cid]/maxCat)*100);

/* ============================================================
   MODALS / SHEETS
   ============================================================ */
function openSheet(innerHtml, onMount){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="overlay" id="overlayEl"><div class="sheet" id="sheetEl">
    <div class="sheet-handle"></div>${innerHtml}</div></div>`;
  const overlay = document.getElementById('overlayEl');
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeSheet(); });
  requestAnimationFrame(()=>overlay.classList.add('show'));
  if(onMount) onMount();
}
function closeSheet(){
  const overlay = document.getElementById('overlayEl');
  if(!overlay) return;
  overlay.classList.remove('show');
  setTimeout(()=>{ document.getElementById('modalRoot').innerHTML=''; }, 220);
}

function openConfirm(iconEmoji, title, desc, confirmLabel, onConfirm){
  openSheet(`
    <div class="confirm-box">
      <div class="confirm-ic">${iconEmoji}</div>
      <h3>${title}</h3><p>${desc}</p>
      <div class="confirm-actions">
        <button class="btn btn-ghost" id="confirmCancel">${t('cancel')}</button>
        <button class="btn btn-danger" id="confirmOk">${confirmLabel}</button>
      </div>
    </div>`, ()=>{
      document.getElementById('confirmCancel').addEventListener('click', closeSheet);
      document.getElementById('confirmOk').addEventListener('click', ()=>{ onConfirm(); closeSheet(); });
    });
}

const EMOJI_SET = ['💼','🎁','➕','🍽️','🚗','🧾','🛍️','💊','🏠','🎬','➖','☕','✈️','🎓','🐾','📱','🎮','👶','💇','🧴','🚕','⚡','💧','🎵','📚','🧰','🌿','🍺','🎂','💳'];
const COLOR_SET = ['#14213D','#C08A2E','#3F7D5C','#B33F3F','#6B7280','#2F6F8F','#8A4FBE','#C2554E'];

/* ---------- Add / Edit Transaction ---------- */
function openTransactionModal(existing){
  if(state.cashboxes.length===0){ openCashboxModal(null); return; }
  const isEdit = !!existing;
  let type = existing ? existing.type : 'expense';
  let cashboxId = existing ? existing.cashboxId : (state.settings.lastCashboxId && getCashbox(state.settings.lastCashboxId) ? state.settings.lastCashboxId : state.cashboxes[0].id);
  let categoryId = existing ? existing.categoryId : null;
  let iconEmoji='';

  function catsFor(tp){ return state.categories.filter(c=>c.type===tp || c.type==='both'); }

  function bodyHtml(){
    const cb = getCashbox(cashboxId);
    const cats = catsFor(type);
    if(!categoryId || !cats.find(c=>c.id===categoryId)) categoryId = cats[0] ? cats[0].id : null;
    return `
      <div class="sheet-head"><h2>${isEdit?t('edit_transaction'):t('add_transaction')}</h2><button class="sheet-close" id="txClose">✕</button></div>
      <div class="seg" style="margin-bottom:16px;">
        <button class="${type==='expense'?'active':''}" data-tx-type="expense">${t('expense')}</button>
        <button class="${type==='income'?'active':''}" data-tx-type="income">${t('income')}</button>
      </div>
      <div class="field"><label>${t('amount')}</label><input type="number" inputmode="decimal" step="0.01" min="0" id="txAmount" placeholder="0.00" value="${existing?existing.amount:''}"></div>
      <div class="field"><label>${t('cashbox')}</label><select id="txCashbox">${state.cashboxes.map(c=>`<option value="${c.id}" ${c.id===cashboxId?'selected':''}>${c.icon} ${escapeHtml(c.name)} (${c.currency})</option>`).join('')}</select></div>
      <div class="field"><label>${t('category')}</label><div class="chip-row" id="txCatRow">
        ${cats.length ? cats.map(c=>`<button type="button" class="chip ${c.id===categoryId?'active':''}" data-tx-cat="${c.id}">${c.icon} ${catName(c)}</button>`).join('') : `<span style="font-size:12.5px;color:var(--text-dim)">${t('no_categories_for_type')}</span>`}
      </div></div>
      <div class="field"><label>${t('description')}</label><input type="text" id="txDesc" placeholder="${t('description_ph')}" value="${existing?escapeHtml(existing.description||''):''}"></div>
      <div class="field"><label>${t('date')}</label><input type="date" id="txDate" value="${existing?existing.date:todayISO()}"></div>
      ${!isEdit ? `
      <div class="field" style="display:flex; align-items:center; justify-content:space-between;">
        <label style="margin:0;">${t('make_recurring')}</label>
        <button class="switch" id="txRecurToggle"></button>
      </div>
      <div id="txRecurBlock" class="hidden">
        <div class="field"><label>${t('frequency')}</label>
          <div class="seg"><button class="active" data-tx-freq="monthly">${t('monthly')}</button><button data-tx-freq="weekly">${t('weekly')}</button><button data-tx-freq="daily">${t('daily')}</button></div>
        </div>
      </div>` : ''}
      <button class="btn btn-primary" id="txSave">${t('save')}</button>
    `;
  }
  let freq='monthly'; let recurOn=false;

  function mount(){
    document.getElementById('txClose').addEventListener('click', closeSheet);
    document.querySelectorAll('[data-tx-type]').forEach(b=>b.addEventListener('click', ()=>{ type=b.getAttribute('data-tx-type'); rerender(); }));
    document.getElementById('txCashbox').addEventListener('change', e=>{ cashboxId=e.target.value; });
    document.querySelectorAll('[data-tx-cat]').forEach(b=>b.addEventListener('click', ()=>{ categoryId=b.getAttribute('data-tx-cat'); rerender(); }));
    const recurToggle = document.getElementById('txRecurToggle');
    if(recurToggle){
      recurToggle.addEventListener('click', ()=>{ recurOn=!recurOn; recurToggle.classList.toggle('on', recurOn); document.getElementById('txRecurBlock').classList.toggle('hidden', !recurOn); });
    }
    document.querySelectorAll('[data-tx-freq]').forEach(b=>b.addEventListener('click', ()=>{
      freq=b.getAttribute('data-tx-freq'); document.querySelectorAll('[data-tx-freq]').forEach(x=>x.classList.remove('active')); b.classList.add('active');
    }));
    document.getElementById('txSave').addEventListener('click', ()=>{
      const amt = parseFloat(document.getElementById('txAmount').value);
      const desc = document.getElementById('txDesc').value.trim();
      const date = document.getElementById('txDate').value || todayISO();
      if(!amt || amt<=0 || isNaN(amt)){ shake('txAmount'); return; }
      if(!categoryId){ return; }
      state.settings.lastCashboxId = cashboxId;
      if(isEdit){
        existing.type=type; existing.amount=amt; existing.cashboxId=cashboxId; existing.categoryId=categoryId; existing.description=desc; existing.date=date;
      } else {
        state.transactions.push({id:uid(), type, amount:amt, cashboxId, categoryId, description:desc, date, createdAt:Date.now()});
        if(recurOn){
          state.recurring.push({id:uid(), type, amount:amt, cashboxId, categoryId, description:desc, frequency:freq, startDate:date, nextDate:nextDateFrom(date,freq), endDate:null, active:true});
        }
      }
      save(); closeSheet(); renderApp(); flashSuccess(); showToast(t('saved'));
    });
  }
  function rerender(){
    document.getElementById('sheetEl').innerHTML = `<div class="sheet-handle"></div>` + bodyHtml();
    mount();
  }
  openSheet(bodyHtml(), mount);
}
function shake(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.style.borderColor='var(--clay)';
  el.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}], {duration:250});
}

/* ---------- Transfer ---------- */
function openTransferModal(){
  if(state.cashboxes.length<2){ openConfirm('🔁', t('transfer_title'), t('need_two_cashboxes'), t('close'), ()=>{}); return; }
  let fromId = state.cashboxes[0].id, toId = state.cashboxes[1].id, rate=1;
  function body(){
    const from = getCashbox(fromId), to = getCashbox(toId);
    const needsRate = from.currency !== to.currency;
    return `
      <div class="sheet-head"><h2>${t('transfer_title')}</h2><button class="sheet-close" id="trClose">✕</button></div>
      <div class="field"><label>${t('from_cashbox')}</label><select id="trFrom">${state.cashboxes.map(c=>`<option value="${c.id}" ${c.id===fromId?'selected':''}>${c.icon} ${escapeHtml(c.name)} (${c.currency})</option>`).join('')}</select></div>
      <div class="field"><label>${t('to_cashbox')}</label><select id="trTo">${state.cashboxes.map(c=>`<option value="${c.id}" ${c.id===toId?'selected':''}>${c.icon} ${escapeHtml(c.name)} (${c.currency})</option>`).join('')}</select></div>
      <div class="field"><label>${t('amount')} (${from.currency})</label><input type="number" step="0.01" id="trAmount" placeholder="0.00"></div>
      ${needsRate ? `<div class="field"><label>${t('exchange_rate')} <span style="color:var(--text-dim); font-weight:400;">(${t('exchange_rate_hint',{from:from.currency,to:to.currency})})</span></label><input type="number" step="0.0001" id="trRate" value="${rate}"></div>
      <div class="field"><label>${t('received_amount')} (${to.currency})</label><input type="text" id="trReceived" disabled></div>` : ''}
      <button class="btn btn-primary" id="trSave">${t('save')}</button>
    `;
  }
  function mount(){
    document.getElementById('trClose').addEventListener('click', closeSheet);
    document.getElementById('trFrom').addEventListener('change', e=>{ fromId=e.target.value; rerender(); });
    document.getElementById('trTo').addEventListener('change', e=>{ toId=e.target.value; rerender(); });
    const amtEl = document.getElementById('trAmount');
    const rateEl = document.getElementById('trRate');
    function updateReceived(){
      const recv = document.getElementById('trReceived');
      if(recv){ const a=parseFloat(amtEl.value)||0; const r=parseFloat(rateEl?rateEl.value:1)||0; recv.value = fmtNum(a*r); }
    }
    if(amtEl) amtEl.addEventListener('input', updateReceived);
    if(rateEl) rateEl.addEventListener('input', updateReceived);
    document.getElementById('trSave').addEventListener('click', ()=>{
      const amt = parseFloat(amtEl.value);
      if(!amt || amt<=0){ shake('trAmount'); return; }
      if(fromId===toId){ shake('trAmount'); return; }
      const from = getCashbox(fromId), to = getCashbox(toId);
      let toAmount = amt;
      if(from.currency!==to.currency){
        const r = parseFloat(document.getElementById('trRate').value)||1;
        toAmount = amt*r;
      }
      state.transactions.push({id:uid(), type:'transfer', amount:amt, cashboxId:fromId, toCashboxId:toId, toAmount, description:'', date:todayISO(), createdAt:Date.now()});
      save(); closeSheet(); renderApp(); showToast(t('saved'));
    });
  }
  function rerender(){ document.getElementById('sheetEl').innerHTML = `<div class="sheet-handle"></div>`+body(); mount(); }
  openSheet(body(), mount);
}

  let cashboxId = existing?existing.cashboxId:state.cashboxes[0].id;
  let categoryId = existing?existing.categoryId:null;
  let freq = existing?existing.frequency:'monthly';
  function catsFor(tp){ return state.categories.filter(c=>c.type===tp||c.type==='both'); }
  function body(){
    const cats = catsFor(type);
    if(!categoryId || !cats.find(c=>c.id===categoryId)) categoryId = cats[0]?cats[0].id:null;
    return `
      <div class="sheet-head"><h2>${isEdit?t('edit_recurring'):t('new_recurring')}</h2><button class="sheet-close" id="rcClose">✕</button></div>

      <div class="field"><label>${t('category')}</label><div class="chip-row">${cats.map(c=>`<button type="button" class="chip ${c.id===categoryId?'active':''}" data-rc-cat="${c.id}">${c.icon} ${catName(c)}</button>`).join('')}</div></div>
      <div class="field"><label>${t('description')}</label><input type="text" id="rcDesc" value="${existing?escapeHtml(existing.description||''):''}"></div>
      <div class="field"><label>${t('frequency')}</label><div class="seg">
        <button class="${freq==='monthly'?'active':''}" data-rc-freq="monthly">${t('monthly')}</button>
        <button class="${freq==='weekly'?'active':''}" data-rc-freq="weekly">${t('weekly')}</button>

      <button class="btn btn-primary" id="rcSave">${isEdit?t('save'):t('create')}</button>
    `;
  }
  function mount(){
    document.getElementById('rcClose').addEventListener('click', closeSheet);
    document.querySelectorAll('[data-rc-type]').forEach(b=>b.addEventListener('click', ()=>{ type=b.getAttribute('data-rc-type'); rerender(); }));
    document.getElementById('rcCashbox').addEventListener('change', e=>cashboxId=e.target.value);
    document.querySelectorAll('[data-rc-cat]').forEach(b=>b.addEventListener('click', ()=>{ categoryId=b.getAttribute('data-rc-cat'); rerender(); }));
    document.querySelectorAll('[data-rc-freq]').forEach(b=>b.addEventListener('click', ()=>{ freq=b.getAttribute('data-rc-freq'); document.querySelectorAll('[data-rc-freq]').forEach(x=>x.classList.remove('active')); b.classList.add('active'); }));
    document.getElementById('rcSave').addEventListener('click', ()=>{
      const amt = parseFloat(document.getElementById('rcAmount').value);

      const end = document.getElementById('rcEnd').value || null;

        if(existing.nextDate < start) existing.nextDate = start;

/* ---------- PIN setup ---------- */
function openPinSetup(){
  let stage='first'; let first='';
  function body(msg){
    return `<div class="sheet-head"><h2>${t('app_lock')}</h2><button class="sheet-close" id="pinClose">✕</button></div>

    <div style="display:flex; justify-content:center; margin:18px 0;"><input type="password" inputmode="numeric" maxlength="4" id="pinInput" style="width:140px; text-align:center; letter-spacing:10px; font-size:22px; border:1.5px solid var(--line); border-radius:12px; padding:12px; background:var(--paper-2);"></div>
    <p style="text-align:center; color:var(--clay); font-size:12.5px; min-height:16px;">${msg||''}</p>
    <button class="btn btn-primary" id="pinNext">${stage==='first'?t('done'):t('done')}</button>`;
  }
  function mount(msg){
    document.getElementById('pinClose').addEventListener('click', closeSheet);
    const input = document.getElementById('pinInput'); input.focus();
    document.getElementById('pinNext').addEventListener('click', ()=>{
      const val = input.value.trim();
      if(!/^\d{4}$/.test(val)){ rerender(t('invalid_pin')); return; }
      if(stage==='first'){ first=val; stage='confirm'; rerender(); }
      else {
        if(val!==first){ stage='first'; first=''; rerender(t('pin_mismatch')); return; }
        state.settings.pinEnabled = true; state.settings.pinCode = val; save(); closeSheet(); renderApp(); showToast(t('saved'));
      }
    });
  }
  function rerender(msg){ document.getElementById('sheetEl').innerHTML = `<div class="sheet-handle"></div>`+body(msg); mount(msg); }
  openSheet(body(), mount);
}

/* ---------- Backup / restore ---------- */
function doBackup(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'smartcash-backup-'+todayISO()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast(t('export_done'));
}
function doCsvExport(){
  const header = ['date','type','cashbox','currency','category','description','amount'];
  const lines = [header.join(',')];
  activeTransactions().slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(tx=>{
    const cb = getCashbox(tx.cashboxId); const cat = getCategory(tx.categoryId);
    const row = [tx.date, tx.type, cb?cb.name:'', cb?cb.currency:'', cat?catName(cat):'', (tx.description||'').replace(/"/g,'""'), tx.amount];
    lines.push(row.map(v=> typeof v==='string' && (v.includes(',')||v.includes('"')) ? `"${v}"` : v).join(','));
  });
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'smartcash-transactions-'+todayISO()+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast(t('csv_done'));
}
function doRestore(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!data || !Array.isArray(data.cashboxes)) throw new Error('invalid');
      openConfirm('⬆️', t('confirm_delete_title'), t('confirm_restore'), t('restore'), ()=>{
        state = data;
        if(!state.budgets) state.budgets=[];
        save(); renderApp(); showToast(t('restored'));
      });
    }catch(err){ showToast(t('invalid_amount')); }
  };
  reader.readAsText(file);
}

/* ============================================================
   LOCK SCREEN
   ============================================================ */
function renderLock(){
  const dots = [0,1,2,3].map(i=>`<div class="pin-dot ${i<ui.pinBuffer.length?'filled':''}"></div>`).join('');
  const keys = [1,2,3,4,5,6,7,8,9,'',0,'⌫'];
  document.getElementById('lockRoot').innerHTML = `
    <div class="lockscreen">
      <div class="lock-mark">🔒</div>
      <div style="font-weight:800; font-size:17px;">${t('enter_pin')}</div>
      <div class="pin-dots">${dots}</div>
      <div class="lock-error">${ui.lockError||''}</div>
      <div class="pin-pad">
        ${keys.map(k=> k===''? `<div></div>` : `<button class="pin-key" data-pinkey="${k}">${k}</button>`).join('')}
      </div>
    </div>`;
  document.querySelectorAll('[data-pinkey]').forEach(b=>b.addEventListener('click', ()=>{
    const k = b.getAttribute('data-pinkey');
    if(k==='⌫'){ ui.pinBuffer = ui.pinBuffer.slice(0,-1); renderLock(); return; }
    if(ui.pinBuffer.length<4){ ui.pinBuffer += k; renderLock(); }
    if(ui.pinBuffer.length===4){
      setTimeout(()=>{
        if(ui.pinBuffer===state.settings.pinCode){
          ui.locked=false; ui.pinBuffer=''; document.getElementById('lockRoot').innerHTML=''; renderApp();
        } else {
          ui.lockError = t('wrong_pin'); ui.pinBuffer=''; renderLock();
        }
      }, 120);
    }
  }));
}

    <div style="display:flex; flex-direction:column; gap:10px;">
      <button class="btn btn-primary" id="acExpense">➖ ${t('expense')}</button>
      <button class="btn btn-primary" id="acIncome" style="background:var(--sage); color:#fff;">➕ ${t('income')}</button>
      <button class="btn btn-ghost" id="acTransfer">🔁 ${t('transfer')}</button>
    </div>
  `, ()=>{
    document.getElementById('acClose').addEventListener('click', closeSheet);
    document.getElementById('acExpense').addEventListener('click', ()=>{ closeSheet(); setTimeout(()=>{ const m={type:'expense'}; openTransactionModalPreset('expense'); }, 200); });
    document.getElementById('acIncome').addEventListener('click', ()=>{ closeSheet(); setTimeout(()=>openTransactionModalPreset('income'), 200); });
    document.getElementById('acTransfer').addEventListener('click', ()=>{ closeSheet(); setTimeout(openTransferModal, 200); });
  });
}
function openTransactionModalPreset(tp){
  // small wrapper to preset type by temporarily monkey-patching default
  openTransactionModal(null);
  // force type after open
  setTimeout(()=>{
    const btn = document.querySelector(`[data-tx-type="${tp}"]`);
    if(btn && !btn.classList.contains('active')) btn.click();
  }, 10);
}
document.querySelectorAll('#bottomnav .nav-item').forEach(el=>{
  el.addEventListener('click', ()=>setRoute(el.getAttribute('data-route')));
});
document.getElementById('btnSettingsTop').addEventListener('click', ()=>setRoute('settings'));
document.getElementById('btnSearchTop').addEventListener('click', ()=>setRoute('ledger'));
document.getElementById('app').addEventListener('scroll', ()=>{}, {passive:true});
window.addEventListener('scroll', ()=>{
  document.getElementById('topbar').classList.toggle('scrolled', window.scrollY>4);
}, {passive:true});

/* ============================================================
   INIT
   ============================================================ */
function init(){
  load();
  processRecurring();
  if(state.settings.pinEnabled){
    ui.locked = true;
    renderLock();
  }
  renderApp();
  const splash = document.getElementById('splashScreen');
  setTimeout(()=>{ if(splash) splash.classList.add('hide'); setTimeout(()=>{ if(splash&&splash.parentNode) splash.remove(); }, 450); }, 550);

  if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{ /* offline caching unavailable in this context; app still works */ });
    });
  }
}
init();
</script>
